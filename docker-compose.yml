services:
  backend:
    build: ./antigravity/backend
    container_name: aegilon-backend
    ports:
      - "8080:8080"
    volumes:
      - ./antigravity/backend:/app
    env_file:
      - ./antigravity/backend/.env
    networks:
      - wazuh_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  detection-engine:
    build: ./antigravity/detection-engine
    container_name: aegilon-detection-engine
    volumes:
      - ./antigravity/detection-engine:/app
    env_file:
      - ./antigravity/detection-engine/.env
    networks:
      - wazuh_net
    depends_on:
      backend:
        condition: service_healthy

  risk-engine:
    build: ./antigravity/risk-engine
    container_name: aegilon-risk-engine
    volumes:
      - ./antigravity/risk-engine:/app
    env_file:
      - ./antigravity/risk-engine/.env
    networks:
      - wazuh_net
    depends_on:
      backend:
        condition: service_healthy

  automation-engine:
    build: ./antigravity/automation-engine
    container_name: aegilon-automation-engine
    volumes:
      - ./antigravity/automation-engine:/app
    env_file:
      - ./antigravity/automation-engine/.env
    networks:
      - wazuh_net
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./antigravity/frontend
    container_name: aegilon-frontend
    ports:
      - "3002:3000"
    environment:
      - BACKEND_PROXY_TARGET=http://backend:8080
    networks:
      - wazuh_net
    depends_on:
      backend:
        condition: service_healthy

networks:
  wazuh_net:
    name: single-node_default
    external: true
