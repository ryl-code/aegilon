services:
  backend:
    build: ./Aegilon/backend
    container_name: aegilon-backend
    ports:
      - "8080:8080"
    volumes:
      - ./Aegilon/backend:/app
    env_file:
      - ./Aegilon/backend/.env
    networks:
      - wazuh_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  detection-engine:
    build: ./Aegilon/detection-engine
    container_name: aegilon-detection-engine
    volumes:
      - ./Aegilon/detection-engine:/app
    env_file:
      - ./Aegilon/detection-engine/.env
    networks:
      - wazuh_net
    depends_on:
      backend:
        condition: service_healthy

  risk-engine:
    build: ./Aegilon/risk-engine
    container_name: aegilon-risk-engine
    volumes:
      - ./Aegilon/risk-engine:/app
    env_file:
      - ./Aegilon/risk-engine/.env
    networks:
      - wazuh_net
    depends_on:
      backend:
        condition: service_healthy

  automation-engine:
    build: ./Aegilon/automation-engine
    container_name: aegilon-automation-engine
    volumes:
      - ./Aegilon/automation-engine:/app
    env_file:
      - ./Aegilon/automation-engine/.env
    networks:
      - wazuh_net
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./Aegilon/frontend
    container_name: aegilon-frontend
    ports:
      - "3002:3000"
    environment:
      - BACKEND_PROXY_TARGET=http://backend:8080
    networks:
      - wazuh_net
    depends_on:
      backend:
        condition: service_healthy

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: aegilon-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
    env_file:
      - ./Aegilon/backend/.env
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - wazuh_net

volumes:
  n8n_data:

networks:
  wazuh_net:
    name: single-node_default
    external: true
