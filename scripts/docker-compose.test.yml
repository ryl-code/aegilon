services:
  test-1-alerts-stream:
    build:
      context: ..
      dockerfile: scripts/Dockerfile.test
    container_name: aegilon-test-alerts-stream
    command: ["python", "/app/scripts/test_1_alerts_stream.py"]
    volumes:
      - .:/app/scripts
    environment:
      - BACKEND_URL=http://backend:8080
    networks:
      - wazuh_net

  test-2-incident-vault:
    build:
      context: ..
      dockerfile: scripts/Dockerfile.test
    container_name: aegilon-test-incident-vault
    command: ["python", "/app/scripts/test_2_incident_vault.py"]
    volumes:
      - .:/app/scripts
    environment:
      - BACKEND_URL=http://backend:8080
