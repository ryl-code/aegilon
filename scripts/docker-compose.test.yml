      - BACKEND_URL=http://backend:8080
    networks:
      - wazuh_net

  test-4-kill-isolate:
    build:
      context: ..
      dockerfile: scripts/Dockerfile.test
    container_name: aegilon-test-kill-isolate
    command: ["python", "/app/scripts/test_4_kill_isolate.py"]
