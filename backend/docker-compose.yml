services:
  postgres:
    image: postgres:16-alpine
    container_name: aegilon-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Map the host port from .env to container's 5432
      # Using a different host port (e.g., 5433) avoids conflicts with native Windows Postgres
      - "${POSTGRES_PORT}:5432"
    volumes:
      - aegilon_pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  aegilon_pgdata:
